<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos los proyectos</title>
</head>
<body>
    {% extends 'layout/header.html' %}
    {% block content %}
        <h1>Projectos</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellat, nemo.</p>
        {{projects}} 
        <!-- Aquí  tenemos otra forma de colocar todos los datos que obtendrémos de la Base de datos con Jinja Loops -->

        {% for project in projects%} <!-- Colocamos un bucle o el inicio del bucle -->
    <div>
        <h2>{{ project.name}}</h2> <!-- Indicamos los nombres de los proyectos para que recorra de uno en uno -->
        <p>Aquí irá la descripción</p>
        <p>{{ project.id }}</p>
        <a href="{% url 'project_detail' project.id %}">Pincha para la ruta</a>
    </div>
            

        {% endfor %} <!-- Indicamos que aquí cierra el bucle -->
    {% endblock %}




















</body>
</html>
